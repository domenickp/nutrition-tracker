# Minimal Supabase local config (as `supabase init` would produce, trimmed).
project_id = "nutrition-tracker"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Single-owner app: accounts are created by hand in the dashboard.
enable_signup = false

[auth.email]
# Sign-ups are already off for every provider via [auth] enable_signup above.
enable_confirmations = false
otp_length = 6
otp_expiry = 3600

[functions.usda]
verify_jwt = true
