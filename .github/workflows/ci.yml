# Checks every pull request and every push to main. On main, once checks pass, deploys the
# `usda` Edge Function if anything it depends on changed. The app itself is deployed by
# Cloudflare Pages, whose build command also runs the tests (see docs/deploy.md, "CI/CD").
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # The function runs on Deno in Supabase; Vitest covers its logic but not Deno typing.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/usda/index.ts

  deploy-usda:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Deploy only when the function, its shared types, or its config changed in this push.
      # A first push (no "before" commit) always deploys.
      - id: changes
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BEFORE" "$AFTER" \
             | grep -qE '^(supabase/functions/|supabase/config\.toml$|src/lib/types\.ts$)'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "No function changes in this push; skipping deploy."
          fi

      - if: steps.changes.outputs.deploy == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - if: steps.changes.outputs.deploy == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Set SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF in the repo's Actions secrets (docs/deploy.md, CI/CD)."
            exit 1
          fi
          supabase functions deploy usda --project-ref "$SUPABASE_PROJECT_REF" --use-api
